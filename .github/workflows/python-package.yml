name: python-package

on:
  pull_request:

permissions:
  contents: read

jobs:
    lint-build-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
                
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                python-version: '3.13'
                enable-cache: true

            - name: Install dependencies
              run: uv sync

            - name: Lint package
              run: uv run pylint ./src

            - name: Lint tests
              run: uv run pylint ./tests

            - name: Build package
              run: uv build

            - name: Run tests
              run: uv run pytest ./tests
    
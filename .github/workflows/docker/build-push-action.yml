name: build-push-docker-image

on:
  pull_request:
  push:
    branches: [ "main" ]
    
permissions:
  contents: write
  packages: write

jobs:
    build:
        name: build-docker-image
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Docker
              uses: docker/setup-buildx-action@v2
                
            - name: Build image                                                                                                                                                              
              run: docker build -t datalama:latest .                                                                                                                                         
                                                                                                                                                                                            
            - name: Export image
              run: docker save datalama:latest | gzip > image.tar.gz

            - uses: actions/upload-artifact@v4
              with:
                name: docker-image
                path: image.tar.gz

    push:
        name: push-docker-image
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                name: docker-image

            - name: Load image
              run: docker load < image.tar.g

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push to GHCR
              uses: docker/build-push-action@v6
              with:
                push: true
                tags: ghcr.io/${{ github.repository }}:latest

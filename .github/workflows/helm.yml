name: helm-chart

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Helm
              uses: azure/setup-helm@v3

            - name: Linting Helm Chart
              run: helm lint ./helm/datalama
              continue-on-error: true
            
            - name: Testing Helm Chart
              run: helm template datalama ./helm/datalama
              continue-on-error: true

    build:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4
            - name: Setup Helm
              uses: azure/setup-helm@v3

            - name: Build Helm Chart
              run: helm package ./helm/datalama --destination ./helm/packages
              continue-on-error: true

            - uses: actions/upload-artifact@v4
              with:
                name: helm-chart
                path: ./helm/packages/datalama-chart*.tgz
              continue-on-error: true
    
    push:
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main'
        steps:
            - uses: actions/download-artifact@v4
              with:
                name: helm-chart
              continue-on-error: true

            - name: Log in to GHCR
              run: helm registry login ghcr.io --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
              continue-on-error: true

            - name: Push Helm Chart to GitHub Packages
              run: helm push *.tgz oci://ghcr.io/${{ github.repository_owner }}
              continue-on-error: true

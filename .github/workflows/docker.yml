name: build-push-docker-image

on:
  pull_request:
  push:
    branches: [ "main" ]
    
permissions:
  contents: write
  packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup Docker
              uses: docker/setup-buildx-action@v2
                
            - name: Build image                                                                                                                                                              
              run: docker build -t datalama:latest .                                                                                                                                         
                                                                                                                                                                                            
            - name: Export image
              run: docker save datalama:latest | gzip > image.tar.gz

            - uses: actions/upload-artifact@v4
              with:
                name: docker-image
                path: docker/image.tar.gz

    push:
        needs: build
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
            - uses: actions/download-artifact@v4
              with:
                name: docker-image
                path: docker/image.tar.gz

            - name: Load image
              run: docker load < image.tar.gz

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push to GHCR
              run: |
                docker tag datalama:latest ghcr.io/${{ github.repository }}:latest
                docker push ghcr.io/${{ github.repository }}:latest

{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "datalama-deployment-chart.fullname" . }}-dashboard-auth
  labels:
    {{- include "datalama-deployment-chart.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.dashboard.auth.username | quote }}
  password: {{ .Values.dashboard.auth.password | quote }}
{{- end }}

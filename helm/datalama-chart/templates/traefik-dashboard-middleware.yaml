{{- if .Values.dashboard.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "datalama-deployment-chart.fullname" . }}-dashboard-auth
  labels:
    {{- include "datalama-deployment-chart.labels" . | nindent 4 }}
spec:
  basicAuth:
    secret: {{ include "datalama-deployment-chart.fullname" . }}-dashboard-auth
{{- end }}


# Container Configuration

# Environment variables for the datalens microservice container
environmentVariables:
  - name: "API_KEY_FIELD_NAME"
    value: "X-API-Key"
  - name: "API_KEY"
    value: "your_api_key_here"
  - name: "LLM_PROVIDER_API_TOKEN"
    value: "api-token"
  - name: "MODEL"
    value: "claude-sonnet-4-6"
  # Optional: LangSmith tracing
  - name: "LANGSMITH_TRACING"
    value: "false"
  - name: "LANGSMITH_API_KEY"
    value: "your-langsmith-api-key"
  - name: "LANGSMITH_PROJECT"
    value: "your-langsmith-project"
  - name: "DEBUG"
    value: "false"
  - name: "HOST"
    value: "0.0.0.0"
  - name: "PORT"
    value: "3000"
  # Optional: Knowledge Base
  - name: "KNOWLEDGE_BASE_ENABLED"
    value: "false"
  - name: "KNOWLEDGE_BASE_CONFIG_PATH"
    value: "/app/config/knowledge_bases.yml"

# Horizontal Pod Autoscaler configuration based on CPU and Memory usage

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 75

# Pod Configuration

replicaCount: 1

podLabels:
  name: datalens-service

resources:                                                                           
  requests:                                                                          
    cpu: "100m"                                                                      
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "128Mi"

# Security Configuration

serviceAccount:
  create: true
  automount: true
  name: "datalens-user-service-account"

# Running the container as non-root user for security
podSecurityContext:                                                                  
  runAsNonRoot: true                                                                 
  runAsUser: 1000
  runAsGroup: 1000

# Security context for the container to further restrict permissions
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

livenessProbe:
  httpGet:
    path: /health
    port: 3000
readinessProbe:
  httpGet:
    path: /health
    port: 3000

# Redis Configuration
redis:
  auth:
    enabled: true
    password: "changeme"              # Override before deploying

# ChromaDB Configuration
chromadb:
  chromadb:
    serverHttpPort: 8000
    collectionName: "datalens"

# Traefik Reverse Proxy Configuration

# Dashboard Configuration (Secret, Middleware, IngressRoute are templated in templates/traefik-dashboard-*.yaml)
dashboard:
  enabled: true
  host: "dashboard.docker.localhost"  # Override for real deployments
  auth:
    username: admin
    password: "changeme"              # Override before deploying
  tls:
    enabled: false
    secretName: ""                    # Name of a k8s Secret containing tls.crt and tls.key

traefik:
  # Enables the dashboard in Secure Mode
  api:
    dashboard: true
    insecure: false

  # Enable Observability
  logs:
    general:
      level: INFO
    # This enables access logs, outputting them to Traefik's standard output by default.
    access:
      enabled: true

  # Enables Prometheus for Metrics
  metrics:
    prometheus:
      enabled: true

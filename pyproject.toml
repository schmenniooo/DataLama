[project]
name = "datalama"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "ollama>=0.6.1",
    "pylint>=4.0.5",
    "pytest>=9.0.2",
    "uvicorn>=0.34.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pylint.main]
source-roots = ["."]

[tool.pylint.messages_control]
  disable = ["fixme"]

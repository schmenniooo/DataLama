[project]
name = "datalens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain>=1.2.13",
    "langchain-anthropic>=1.4.0",
    "langsmith>=0.7.22",
    "pylint>=4.0.5",
    "pytest>=9.0.2",
    "uvicorn>=0.34.0",
]

[tool.uv]                                                                  
  compile-bytecode = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pylint.main]
source-roots = ["."]

[tool.pylint.messages_control]
  disable = ["fixme", "logging-fstring-interpolation", "raise-missing-from"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
